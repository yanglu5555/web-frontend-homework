<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lalacake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #f8f6db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 999;
            font-family: "宋体";
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: #867f7f;
            font-size: 25px;
        }

        .nav-menu a:hover {
            color: #c9ad83;
        }

        .nav-user {
            font-size: 25px;
            color: #e3d49a;
        }

        body {
            background-color: #f9e9ba;
            min-height: 200vh;
            padding-top: 60px;
            font-family: "宋体";
        }

        .header-section {
            text-align: center;
            padding-top: 80px;
            padding-bottom: 20px;
        }

        .curve-title {
            font-size: 100px;
            font-weight: bold;
            color: #e3d49a;
            margin-bottom: 20px;
        }

        .curve-title span {
            display: inline-block;
            transform-origin: center bottom;
        }

        .header-img {
            width: 500px;
            height: auto;
            border-radius: 10px;
        }

        /* 轮播图样式 */
        .carousel {
            position: relative;
            width: 90%;
            height: 400px;
            margin: 0 auto 30px;
            border-radius: 15px;
            overflow: hidden;
        }

        .carousel-inner {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .carousel-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease;
        }

        .carousel-item.active {
            opacity: 1;
        }

        /* 左右箭头 */
        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 24px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        /* 小圆点 */
        .dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background: white;
        }

        /* 新品标题 */
        .new-title {
            text-align: center;
            font-size: 40px;
            color: #9c773f;
            margin: 40px 0 20px 0;
        }

        /* 精品产品 */
        .product-section {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            font-size: 40px;
            color: #9c773f;
            margin: 60px 0 40px 0;
        }

        .product-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .item {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item h3 {
            font-size: 22px;
            color: #867f7f;
            margin: 15px 0;
        }

        .item p {
            color: #9c773f;
            font-size: 18px;
        }

        /* 页脚 */
        .footer {
            background: #f8f6db;
            padding: 50px 20px;
            text-align: center;
            margin-top: 80px;
        }

        .footer h3 {
            font-size: 28px;
            color: #9c773f;
            margin-bottom: 20px;
        }

        .footer p {
            font-size: 20px;
            color: #867f7f;
            line-height: 1.8;
        }

        .footer-bottom {
            margin-top: 30px;
            font-size: 18px;
            color: #c9ad83;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <ul class="nav-menu">
            <li><a href="#">蛋糕</a></li>
            <li><a href="#">饮品</a></li>
            <li><a href="#">品牌信息</a></li>
        </ul>
        <div class="nav-user"><a href="#" style="color: #9c773f;">账户</a></div>
    </div>

    <div class="header-section">
        <h1 class="curve-title">
            <span style="transform:rotate(-18deg)">l</span>
            <span style="transform:rotate(-12deg)">a</span>
            <span style="transform:rotate(-6deg)">l</span>
            <span style="transform:rotate(0deg)">a</span>
            <span style="transform:rotate(6deg)">c</span>
            <span style="transform:rotate(12deg)">a</span>
            <span style="transform:rotate(18deg)">k</span>
            <span style="transform:rotate(24deg)">e</span>
        </h1>
        <img class="header-img" src="./img/retouch_2026041918122701.png" alt="照片">
    </div>

    <!-- 主轮播 三张图 -->
    <div class="carousel" id="carousel1">
        <div class="carousel-inner">
            <div class="carousel-item active" style="background-image:url('./img/b1.jpg')"></div>
            <div class="carousel-item" style="background-image:url('./img/b2.jpg')"></div>
            <div class="carousel-item" style="background-image:url('./img/b3.jpg')"></div>
        </div>
        <button class="prev">‹</button>
        <button class="next">›</button>
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <!-- 新品轮播 -->
    <h2 class="new-title">新品上市</h2>
    <div class="carousel" id="carousel2">
        <div class="carousel-inner">
            <div class="carousel-item active" style="background-image:url('./img/new1.jpg')"></div>
            <div class="carousel-item" style="background-image:url('./img/new2.jpg')"></div>
            <div class="carousel-item" style="background-image:url('./img/new3.jpg')"></div>
        </div>
        <button class="prev">‹</button>
        <button class="next">›</button>
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <!-- 精品产品 -->
    <div class="product-section">
        <h2 class="section-title">精选产品</h2>
        <div class="product-box">
            <div class="item">
                <img src="./img/cake1.jpg" alt="蛋糕">
                <h3>草莓奶油蛋糕</h3>
                <p>新鲜草莓 · 柔滑奶油</p>
            </div>
            <div class="item">
                <img src="./img/cake2.jpg" alt="蛋糕">
                <h3>巧克力慕斯</h3>
                <p>浓郁巧克力 · 入口即化</p>
            </div>
            <div class="item">
                <img src="./img/drink1.jpg" alt="饮品">
                <h3>蜂蜜奶茶</h3>
                <p>香甜蜂蜜 · 丝滑口感</p>
            </div>

            <div class="item">
                <img src="./img/cake3.jpg" alt="蛋糕">
                <h3>芒果千层蛋糕</h3>
                <p>香甜芒果 · 层层软糯</p>
            </div>
            <div class="item">
                <img src="./img/cake4.jpg" alt="蛋糕">
                <h3>芋泥爆浆蛋糕</h3>
                <p>手工芋泥 · 奶香浓郁</p>
            </div>
            <div class="item">
                <img src="./img/drink2.jpg" alt="饮品">
                <h3>杨枝甘露</h3>
                <p>清爽果味 · 夏日必备</p>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        <h3>lalacake · 给你甜蜜的每一天</h3>
        <p>地址：XX市XX路XX号</p>
        <p>营业时间：10:00 - 21:00</p>
        <p>联系电话：123-4567-8901</p>
        <div class="footer-bottom">
            © 2025 lalacake
        </div>
    </div>

    <script>
        function startCarousel(id) {
            const box = document.getElementById(id);
            const items = box.querySelectorAll('.carousel-item');
            const dots = box.querySelectorAll('.dot');
            const prev = box.querySelector('.prev');
            const next = box.querySelector('.next');
            let index = 0;

            function show() {
                items.forEach((i, k) => i.classList.toggle('active', k === index));
                dots.forEach((d, k) => d.classList.toggle('active', k === index));
            }

            prev.onclick = () => {
                index = (index - 1 + 3) % 3;
                show();
            }

            next.onclick = () => {
                index = (index + 1) % 3;
                show();
            }

            dots.forEach((d, i) => {
                d.onclick = () => {
                    index = i;
                    show();
                }
            })

            setInterval(() => {
                index = (index + 1) % 3;
                show();
            }, 3000);
        }

        startCarousel('carousel1');
        startCarousel('carousel2');
    </script>

</body>

</html>
